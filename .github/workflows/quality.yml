name: Quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: festival
          POSTGRES_PASSWORD: festival
          POSTGRES_DB: festival_integration
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U festival -d festival_integration"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://festival:festival@127.0.0.1:5432/festival_integration
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.node-version'
          cache: npm
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run prisma:generate
      - run: npx prisma migrate deploy
      - run: node --import tsx --test tests/prisma-adapter.e2e.test.mjs
      - run: ARTIST_ENRICHMENT_TEST_DATABASE_URL="$DATABASE_URL" npm run test:artist-enrichment-db
      - run: SPOTIFY_STATS_TEST_DATABASE_URL="$DATABASE_URL" node --import tsx --test tests/spotify-stats-worker.e2e.test.mjs
      - run: npm run test:logo-assets
      - run: npm run test:playlist-queue
      - run: node --import tsx --test tests/spotify-playlist-checkpoint.e2e.test.ts
      - run: node --import tsx --test tests/youtube-recovery.e2e.test.ts
      - run: npm run test:sources
      - run: npm run test:catalog-db
      - run: node --import tsx --test tests/import-agent.e2e.test.ts
      - run: node --import tsx --test tests/import-events.e2e.test.ts
      - run: node --import tsx --test tests/impericon-current.e2e.test.ts
      - run: node --import tsx --test tests/source-failure-policy.e2e.test.ts
      - run: npm run test:seed
      - run: node --import tsx --test tests/offline-catalog.e2e.test.ts
      - run: npm run test:logo-serving
      - run: npm run test:logo-serving-db
      - run: npm run test:due-worker
      # Explicit ISO UTC binds must preserve the source lease and fenced
      # publication against UTC-naive columns with a non-UTC database session.
      - run: printf "ALTER DATABASE festival_integration SET TimeZone TO 'Europe/Berlin';" | npx prisma db execute --stdin
      - run: node --import tsx --test tests/ingestion-lease.e2e.test.ts && node --import tsx --test tests/ingestion-due-worker.e2e.test.mjs
        env:
          TEST_DB_TIMEZONE: Europe/Berlin
      - run: printf "ALTER DATABASE festival_integration SET TimeZone TO 'UTC';" | npx prisma db execute --stdin
      - run: npm run test:integration
      - run: npm run test:admin:integration
      - run: npx prisma migrate reset --force
      - run: npm run test:seed
      - run: npm run typecheck
      - run: npm run test:persistence-db
      - run: npm run test:data
      - run: npm run test:notifications:e2e
      - run: python3 -m pip install -r requirements.txt
      - run: PLAYLIST_TEST_DATABASE_URL="$DATABASE_URL" node --import tsx --test --test-concurrency=1 tests/fileless-playlist-worker.e2e.test.ts tests/playlist-provider-worker.e2e.test.ts tests/playlist-creation.e2e.test.ts tests/youtube-playlist-publication.e2e.test.ts tests/spotify-playlist-checkpoint.e2e.test.ts
      - run: npm run test:runtime
      - run: python3 -m unittest discover -s tests
      - run: npm run build
      # Exercise the actual archive: builder and production both target Python 3.13.
      - run: bash scripts/deploy/package-release.sh "$GITHUB_SHA" "$RUNNER_TEMP/python313-release.tar.gz"
      - name: Validate Prisma in the extracted production archive
        run: |
          mkdir "$RUNNER_TEMP/prisma7-release"
          tar -xzf "$RUNNER_TEMP/python313-release.tar.gz" -C "$RUNNER_TEMP/prisma7-release"
          cd "$RUNNER_TEMP/prisma7-release/app"
          .runtime/node .runtime/npm/bin/npm-cli.js ci --omit=dev --ignore-scripts --no-audit --no-fund
          .runtime/node node_modules/prisma/build/index.js generate
          .runtime/node node_modules/prisma/build/index.js migrate deploy
          .runtime/node scripts/deploy/check-prisma-release.mjs
      - name: Validate archive in the production Python version
        run: |
          docker run --rm \
            -v "$RUNNER_TEMP/python313-release.tar.gz:/release.tar.gz:ro" \
            -v "$GITHUB_WORKSPACE/scripts/deploy/check-python-release.sh:/check.sh:ro" \
            python:3.13.18-slim bash /check.sh /release.tar.gz
      - run: npm run test:routes

  browser-tests:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: festival
          POSTGRES_PASSWORD: festival
          POSTGRES_DB: festival_integration
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U festival -d festival_integration"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.node-version'
      - name: Run full browser suite in the prebuilt Playwright image
        env:
          PLAYWRIGHT_IMAGE: mcr.microsoft.com/playwright:v1.65.0-noble@sha256:6e3fb709361521eb27161606e6da6d2674e5e89fa16516cb37d6fdd91372273d
        run: |
          node_root="$(dirname "$(dirname "$(command -v node)")")"
          # Host networking keeps the isolated Postgres service at loopback,
          # preserving the tests' strict local-disposable-database guards.
          docker run --rm --init --ipc=host --network=host \
            -v "$GITHUB_WORKSPACE:/work" -w /work \
            -v "$node_root:/node-runtime:ro" \
            -e CI=true -e PLAYWRIGHT_IMAGE_VERSION=1.65.0 \
            -e DATABASE_URL=postgresql://festival:festival@127.0.0.1:5432/festival_integration \
            "$PLAYWRIGHT_IMAGE" bash scripts/ci-browser-tests.sh

  # Preserve the existing required-check name. A failed, cancelled or skipped
  # browser job must never make the release gate green.
  test-and-build:
    runs-on: ubuntu-24.04
    needs: [core, browser-tests]
    if: ${{ always() }}
    steps:
      - name: Require both core and browser checks
        env:
          CORE_RESULT: ${{ needs.core.result }}
          BROWSER_RESULT: ${{ needs.browser-tests.result }}
        run: |
          test "$CORE_RESULT" = success
          test "$BROWSER_RESULT" = success
